<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-body">
    <div class="login-container">
        <img src="{% static 'logo.png' %}" class="login-logo">
        <h2>📝 Crear Cuenta</h2>
        
        {% if messages %}
            {% for message in messages %}
                <p style="color: {% if message.tags == 'success' %}green{% else %}red{% endif %};">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <input name="email" placeholder="Correo" autocomplete="username" required>
            <input name="password" type="password" placeholder="Contraseña" autocomplete="new-password" required>
            <button type="submit" class="btn-success">Registrarse</button>
        </form>
        
        <p>¿Ya tienes cuenta?</p>
        <a href="{% url 'login' %}">Volver al login</a>
    </div>
</body>
</html>
