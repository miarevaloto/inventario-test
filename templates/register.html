<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="login-body">
  <div class="login-container">
    <img src="/static/logo.png" class="login-logo">
    <h2>📝 Crear Cuenta</h2>

    <input id="email" placeholder="Correo" autocomplete="username">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="new-password">

    <button onclick="register()" class="btn-success">Registrarse</button>

    <p>¿Ya tienes cuenta?</p>
    <button onclick="window.location='/login'" class="btn-primary">Volver al login</button>
  </div>

  <script>
  async function register() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    // ✅ VALIDACIÓN CORREGIDA - AHORA SÍ VALIDA CAMPOS VACÍOS
    if (!email || !password) {
      alert('❌ Por favor complete todos los campos (correo y contraseña)');
      return;
    }

    // ✅ VALIDACIÓN EXTRA: formato de email
    if (!email.includes('@') || !email.includes('.')) {
      alert('❌ Por favor ingrese un correo electrónico válido');
      return;
    }

    // ✅ VALIDACIÓN EXTRA: contraseña muy corta
    if (password.length < 4) {
      alert('❌ La contraseña debe tener al menos 4 caracteres');
      return;
    }

    try {
      const response = await axios.post("/register", { email, password });

      if (typeof response.data !== "object") {
        console.error("Respuesta inesperada:", response.data);
        alert("❌ Error del servidor: respuesta no válida");
        return;
      }

      console.log("Respuesta:", response.data);

      if (response.data.ok) {
        alert("✅ " + (response.data.msg || "Usuario creado correctamente"));
        window.location = "/login";
      } else {
        alert("❌ " + (response.data.msg || "Error al crear usuario"));
      }
    } catch (error) {
      console.error("Error:", error);
      if (error.response && error.response.data && error.response.data.msg) {
        alert("❌ " + error.response.data.msg);
      } else {
        alert("❌ Error al conectar con el servidor: " + (error.message || "desconocido"));
      }
    }
  }

  // Permitir presionar Enter
  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') register();
  });
  </script>
</body>
</html>
