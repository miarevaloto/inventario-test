<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="login-body">

<div class="login-container">

    <!-- LOGO -->
    <img src="/static/logo.png" class="login-logo">

    <h2>📝 Crear Cuenta</h2>

    <input id="email" placeholder="Correo">
    <input id="password" type="password" placeholder="Contraseña">

    <button onclick="register()" class="btn-success">Registrarse</button>

    <p>¿Ya tienes cuenta?</p>

    <button onclick="window.location='/login'" class="btn-primary">
        Volver al login
    </button>
</div>

<script>
async function register(){
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
        alert('Por favor complete todos los campos');
        return;
    }
    
    try {
        const response = await axios.post("/register", {
            email: email,
            password: password
        });
        
        console.log('Respuesta:', response.data);
        
        if(response.data.ok){
            alert(response.data.msg || "Usuario creado correctamente ✅");
            window.location = "/login";
        } else {
            alert(response.data.msg || "Error al crear usuario");
        }
    } catch(error) {
        console.error('Error:', error);
        alert('Error al conectar con el servidor');
    }
}

// Permitir presionar Enter para enviar
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        register();
    }
});
</script>

</body>
</html>
