<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-body">
  <div class="login-container">
    <img src="/static/logo.png" class="login-logo">
    <h2>Iniciar Sesión</h2>

    <input id="email" placeholder="Correo" autocomplete="username">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">

    <button onclick="login()">Ingresar</button>

    <p>¿No tienes cuenta?</p>
    <a href="/register">Registrarse</a>
  </div>

  <script>
  async function login() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    // ✅ VALIDACIÓN CORREGIDA - AHORA SÍ VALIDA CAMPOS VACÍOS
    if (!email || !password) {
      alert('❌ Por favor ingrese correo y contraseña');
      return;
    }

    try {
      console.log('Enviando petición a /login');

      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const contentType = response.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        const text = await response.text();
        console.error('Respuesta inesperada del servidor:', text);
        alert('Error del servidor: respuesta no válida');
        return;
      }

      const data = await response.json();
      console.log('Datos:', data);

      if (data.ok) {
        window.location.href = data.redirect;
      } else {
        alert(data.msg || "❌ Credenciales incorrectas");
      }
    } catch (error) {
      console.error('Error:', error);
      alert('❌ Error al conectar con el servidor: ' + error.message);
    }
  }

  // Permitir presionar Enter
  document.getElementById('password').addEventListener('keypress', e => {
    if (e.key === 'Enter') login();
  });
  </script>
</body>
</html>
