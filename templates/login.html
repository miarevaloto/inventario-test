<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-body">

<div class="login-container">

    <!-- LOGO -->
    <img src="/static/logo.png" class="login-logo">

    <h2>Iniciar Sesión</h2>

    <input id="email" placeholder="Correo">
    <input id="password" type="password" placeholder="Contraseña">

    <button onclick="login()">Ingresar</button>

    <p>¿No tienes cuenta?</p>
    <a href="/register">Registrarse</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script>
async function login(){
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    if (!email || !password) {
        alert('Por favor ingrese correo y contraseña');
        return;
    }
    
    try {
        const response = await axios.post("/login", {
            email: email,
            password: password
        });
        
        console.log('Respuesta:', response.data); // Para depuración
        
        if(response.data.ok){
            window.location.href = response.data.redirect;
        } else {
            alert(response.data.msg || "Credenciales incorrectas");
        }
    } catch(error) {
        console.error('Error:', error);
        alert('Error al conectar con el servidor. Verifique que el servidor esté corriendo.');
    }
}

// Permitir presionar Enter para enviar
document.getElementById('password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        login();
    }
});
</script>

</body>
</html>
